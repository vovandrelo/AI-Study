spring:
  application:
    name: 02-chat-memory

server:
  port: 8082

# Параметры LLM-провайдера, читаются в LlmConfig через @Value.
ollama:
  base-url: http://localhost:11434
  model: qwen2.5:7b
  temperature: 0.7

# Параметры чата (серверная сторона). Клиент эти значения не трогает.
chat:
  # Системный промпт всей беседы — добавляется один раз в начало.
  system-prompt: >-
    Ты — помощник, который помогает разработчику изучать построение ИИ-агентов на Java.
    Отвечай кратко, по делу, на русском языке.
    Если пользователь сообщает о себе факты (имя, задачу) — запоминай и используй в ответах.
  memory:
    # Размер окна сообщений в MessageWindowChatMemory.
    # Системный промпт + последние (max-messages - 1) реплик отправляются в модель.
    # Слишком маленькое окно = модель «забывает» контекст; слишком большое = дорого по токенам.
    max-messages: 20

logging:
  level:
    dev.langchain4j: INFO
