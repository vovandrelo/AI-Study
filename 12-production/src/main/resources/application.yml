spring:
  application:
    name: 12-production

ollama:
  base-url: http://localhost:11434
  model: qwen2.5:7b
  temperature: 0.7

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

server:
  port: 8012
