spring:
  application:
    name: 01-basic-chat

server:
  port: 8081

# Параметры LLM-провайдера, читаются в LlmConfig через @Value.
ollama:
  base-url: http://localhost:11434
  model: qwen2.5:7b
  temperature: 0.7

# Системный промпт чата. Задаётся на стороне сервера (НЕ передаётся клиентом).
# Меняем здесь — поведение модели меняется без правки кода.
chat:
  system-prompt: >-
    Ты — помощник, который помогает разработчику изучать построение ИИ-агентов на Java.
    Отвечай кратко, по делу, на русском языке.
    Если вопрос не связан с разработкой — мягко возвращай разговор к теме.

logging:
  level:
    dev.langchain4j: INFO
